[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aieye"
version = "2.2.0"
description = "AI eye：一眼看懂、一键转好的文档格式互转工具。txt / md / html / csv / xlsx / docx / pdf 双向转换，支持中文编码自动识别、扫描件 OCR 与 Fluent Design 桌面界面"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AI eye contributors" }]
keywords = [
    "aieye", "markdown", "txt", "docx", "xlsx", "pdf", "converter",
    "document-conversion", "batch", "chinese", "gbk", "windows",
    "ocr", "fluent", "pyside6",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]

dependencies = [
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "charset-normalizer>=3.0",
]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.6"]
# 扫描件 OCR：模型随包分发、离线运行；headless 版 OpenCV 避免与 PySide6 的 Qt 冲突
ocr = ["rapidocr-onnxruntime>=1.2", "opencv-python-headless>=4.8"]
# 兜底引擎：体积较大（内含 pandoc 二进制约 231MB），按需启用
pandoc = ["pypandoc-binary>=1.13"]
dev = [
    "PySide6-Essentials>=6.6",
    "pyinstaller>=6.0",
    "pypandoc-binary>=1.13",
    "rapidocr-onnxruntime>=1.2",
    "opencv-python-headless>=4.8",
]

# 仓库地址沿用原路径：GitHub 上的仓库还没改名，写成 /aieye 会 404。
# 仓库改名后把下面四处一起换掉即可。
[project.urls]
Homepage = "https://github.com/Xiaolinkemengwei/txt2md"
Repository = "https://github.com/Xiaolinkemengwei/txt2md"
Issues = "https://github.com/Xiaolinkemengwei/txt2md/issues"
Changelog = "https://github.com/Xiaolinkemengwei/txt2md/blob/main/CHANGELOG.md"

[project.scripts]
aieye = "aieye:main"
# 兼容 1.0 / 2.0 已经写进脚本的旧命令名
txt2md = "aieye:main"

[tool.setuptools]
py-modules = ["aieye"]

[tool.setuptools.packages.find]
include = ["core*", "gui*"]
